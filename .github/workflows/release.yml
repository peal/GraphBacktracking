name: Release

on:
  workflow_dispatch:
    inputs:
      dry-run:
        description: Create release artifacts without publishing
        type: boolean
        default: false
      force:
        description: Allow replacing a release or using a different release date
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Release the GAP package
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
      - uses: gap-actions/setup-gap@v3
        with:
          gap-version: devel
      - uses: gap-actions/install-pkg@v1
        with:
          packages: peal/BacktrackKit@devel
      - uses: gap-actions/build-pkg@v3
        with:
          coverage: false
      - name: Build BacktrackKit manual for cross-references
        env:
          NOPDF: '1'
        run: |
          cd "$GAPROOT/pkg/backtrackkit"
          gap --quitonbreak makedoc.g
      - uses: gap-actions/build-pkg-docs@v2
        with:
          use-latex: true
      - name: Fix documentation links for distribution
        run: bash .release
      - uses: gap-actions/release-pkg@v1
        with:
          dry-run: ${{ inputs.dry-run }}
          force: ${{ inputs.force }}
      - uses: gap-actions/update-gh-pages@v1
        if: ${{ !inputs.dry-run }}
        with:
          version: ${{ env.TAG }}
          clean: false
